<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wzh | 个人主页</title>
  <meta name="description" content="王子涵的个人主页，展示教育背景、科研方向、项目经历与联系方式。">
  <meta name="keywords" content="王子涵,个人主页,简历,计算机科学与技术,三峡大学,科研,项目">
  <link rel="icon" type="image/png" href="assets/image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
</head>

<body data-page="home">
  <header class="header" id="navigation">
    <div class="shell header-inner">
      <a class="logo" href="#home">
        <span class="logo-name">WangZihan</span>
      </a>
      <button class="menu-icon" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <span class="navicon"></span>
      </button>
      <nav class="menu" id="navMenu" aria-label="主导航">
        <a class="nav-link" href="#home">首页</a>
        <a class="nav-link" href="#skills">技能</a>
        <a class="nav-link" href="#experience">经历</a>
        <a class="nav-link" href="#achievements">获奖</a>
        <a class="nav-link" href="#contact">联系</a>
        <a class="nav-link" href="resume.html">简历</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" aria-pressed="false" title="切换明暗主题">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb">
            <span class="theme-icon theme-icon-light">
              <svg viewBox="0 0 24 24" class="theme-svg" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
                <path
                  d="M12 1.75v3M12 19.25v3M1.75 12h3M19.25 12h3M4.4 4.4l2.12 2.12M17.48 17.48l2.12 2.12M19.6 4.4l-2.12 2.12M6.52 17.48 4.4 19.6"
                  fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
              </svg>
            </span>
            <span class="theme-icon theme-icon-dark">
              <svg viewBox="0 0 24 24" class="theme-svg" aria-hidden="true">
                <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.7 8.7 0 1 0 10.2 10.2Z" fill="currentColor"></path>
              </svg>
            </span>
          </span>
        </span>
      </button>
    </div>
  </header>

  <main class="app">
    <section class="main" id="home">
      <div class="shell greeting-main">
        <div class="greeting-text-div">
          <h1 class="greeting-text">
            <span class="wave-emoji">Hi</span>
            <span id="heroName"> 王子涵</span>
          </h1>
          <h2 class="greeting-subtitle" id="heroTitle"></h2>
          <div class="hero-badges" id="heroTags"></div>
          <div class="button-greeting-div">
            <a class="main-button" href="resume.html">查看简历</a>
            <a class="main-button button-secondary" href="#contact">联系我</a>
          </div>
          <p class="greeting-text-p sub-title" id="summaryIntro"></p>
          <div class="hero-inline-metrics" id="heroMetrics"></div>
        </div>
        <div class="greeting-image-div">
          <div class="hero-avatar-wrapper">
            <div class="hero-avatar-orb hero-avatar-orb-one"></div>
            <div class="hero-avatar-orb hero-avatar-orb-two"></div>
            <div class="hero-avatar-frame">
              <img src="assets/avatar.png" alt="Homepage avatar" class="hero-avatar-image">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="main section" id="skills">
      <div class="shell skills-main-div">
        <div class="skills-image-div">
          <div class="skills-lottie-mount" id="skillsLottie" aria-label="skills illustration"></div>
        </div>
        <div class="skills-text-div">
          <h2 class="skills-heading">What I do</h2>
          <p class="sub-title" id="summaryIntro"></p>
          <p class="skills-support" id="skillsSupport"></p>
          <!-- <div class="skills-pill-list" id="heroSummary"></div> -->
          <div class="skills-card-grid" id="skillsContent"></div>
        </div>
      </div>
    </section>

    <section class="main section" id="experience">
      <div class="shell experience-section">
        <div class="section-header">
          <h2 class="section-title">Experience</h2>
        </div>
        <div class="experience-grid">
          <article class="experience-card experience-card-featured">
            <p class="experience-label">Education</p>
            <h3 id="educationSchool"></h3>
            <p class="experience-meta" id="educationDegree"></p>
            <p class="experience-meta" id="educationPeriod"></p>
            <div class="experience-stats">
              <div class="stat-card">
                <span>绩点</span>
                <strong id="educationGpa"></strong>
              </div>
              <div class="stat-card">
                <span>排名</span>
                <strong id="educationRanking"></strong>
              </div>
            </div>
            <p class="card-text" id="educationNote"></p>
            <div class="tag-list" id="courseList"></div>
          </article>
          <article class="experience-card">
            <p class="experience-label">Research</p>
            <h3 id="researchRole"></h3>
            <p class="experience-meta" id="researchMeta"></p>
            <p class="card-text" id="researchOverview"></p>
            <div class="timeline-list" id="researchItems"></div>
          </article>
        </div>
        <div class="project-block">
          <div class="section-header compact">
            <h3 class="section-subtitle">Projects</h3>
          </div>
          <div class="project-grid" id="projectsGrid"></div>
        </div>
      </div>
    </section>

    <section class="main section" id="achievements">
      <div class="shell achievement-section">
        <div class="section-header">
          <h2 class="section-title">Achievements</h2>
        </div>
        <div class="achievement-grid" id="awardsGrid"></div>
      </div>
    </section>

    <section class="main section" id="contact">
      <div class="shell contact-section">
        <div class="contact-text-div">
          <h2 class="section-title">Reach Out to me!</h2>
          <p class="contact-subtitle" id="contactIntro"></p>
          <div class="contact-card">
            <div class="contact-list" id="profileList"></div>
            <div class="contact-links" id="contactLinks"></div>
          </div>
        </div>
        <div class="contact-image-div">
          <div class="section-illustration section-illustration-contact">
            <div class="illustration-circle illustration-circle-large"></div>
            <div class="contact-panel-visual">
              <div class="contact-panel-top"></div>
              <div class="contact-panel-lines">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
            <div class="contact-float-card">
              <p>Resume</p>
              <a href="resume.html">Open Resume</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-content">
      <p class="footer-text">王子涵 · 计算机科学与技术本科生</p>
      <p class="footer-text" id="footerStatus"></p>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="回到顶部">↑</button>

  <script src="scripts/theme.js"></script>
  <script src="scripts/lottie.min.js" defer></script>
  <script src="scripts/skills-lottie.js" defer></script>
  <script src="scripts/main.js" defer></script>
</body>

</html>
