<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王子涵 | 简历</title>
  <meta name="description" content="王子涵的在线简历页面。">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="resume">
  <header class="header">
    <div class="shell header-inner">
      <a class="logo" href="index.html">
        <span class="logo-name">WangZihan</span>
      </a>
      <nav class="menu menu-static" aria-label="简历导航">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link active" href="resume.html">简历</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" aria-pressed="false" title="切换明暗主题">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb">
            <span class="theme-icon theme-icon-light">
              <svg viewBox="0 0 24 24" class="theme-svg" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
                <path d="M12 1.75v3M12 19.25v3M1.75 12h3M19.25 12h3M4.4 4.4l2.12 2.12M17.48 17.48l2.12 2.12M19.6 4.4l-2.12 2.12M6.52 17.48 4.4 19.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
              </svg>
            </span>
            <span class="theme-icon theme-icon-dark">
              <svg viewBox="0 0 24 24" class="theme-svg" aria-hidden="true">
                <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.7 8.7 0 1 0 10.2 10.2Z" fill="currentColor"></path>
              </svg>
            </span>
          </span>
        </span>
      </button>
    </div>
  </header>

  <main class="resume-main">
    <div class="shell">
      <section class="resume-sheet">
        <header class="resume-header">
          <div>
            <p class="eyebrow">Resume</p>
            <h1 id="resumeName">王子涵</h1>
            <p class="resume-role" id="resumeTitle"></p>
          </div>
          <div class="resume-contact" id="resumeContact"></div>
        </header>

        <section class="resume-block">
          <div class="resume-block-title">
            <span></span>
            <h2>个人概况</h2>
          </div>
          <div class="resume-summary" id="resumeSummary"></div>
        </section>

        <section class="resume-block">
          <div class="resume-block-title">
            <span></span>
            <h2>教育背景</h2>
          </div>
          <div class="resume-entry">
            <div class="resume-entry-head">
              <h3 id="resumeEducationSchool"></h3>
              <p id="resumeEducationPeriod"></p>
            </div>
            <p id="resumeEducationDegree"></p>
            <p class="muted" id="resumeEducationNote"></p>
            <div class="chip-list" id="resumeCourses"></div>
          </div>
        </section>

        <section class="resume-block">
          <div class="resume-block-title">
            <span></span>
            <h2>科研经历</h2>
          </div>
          <div class="resume-entry">
            <div class="resume-entry-head">
              <h3 id="resumeResearchRole"></h3>
              <p id="resumeResearchPeriod"></p>
            </div>
            <p class="muted" id="resumeResearchMeta"></p>
            <p id="resumeResearchOverview"></p>
            <div class="resume-list" id="resumeResearchItems"></div>
          </div>
        </section>

        <section class="resume-block">
          <div class="resume-block-title">
            <span></span>
            <h2>项目经历</h2>
          </div>
          <div class="resume-projects" id="resumeProjects"></div>
        </section>

        <section class="resume-block">
          <div class="resume-block-title">
            <span></span>
            <h2>获奖与技能</h2>
          </div>
          <div class="resume-columns">
            <div>
              <h3 class="resume-subtitle">竞赛获奖</h3>
              <div class="resume-list" id="resumeAwards"></div>
            </div>
            <div>
              <h3 class="resume-subtitle">技能矩阵</h3>
              <div class="resume-skill-groups" id="resumeSkills"></div>
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script src="scripts/theme.js"></script>
  <script src="scripts/main.js" defer></script>
</body>
</html>
