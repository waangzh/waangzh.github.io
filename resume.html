<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王子涵 | 简历</title>
  <meta name="description" content="王子涵的在线简历页面。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/resume.css">
  <link rel="stylesheet" href="styles/navigation.css">
</head>
<body data-page="resume">
<header class="site-header"><div class="shell site-header-inner">
  <a class="site-logo" href="index.html#home">wangzihan.dev</a>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="index.html#home">首页</a>
    <a class="nav-link" href="index.html#projects">项目</a>
    <a class="nav-link" href="index.html#about">关于</a>
    <a class="nav-link" href="index.html#contact">联系方式</a>
    <a class="nav-link active" href="resume.html">简历</a>
  </nav>
</div></header>
  <main class="resume-main resume-page-compact">
    <div class="resume-paper">
      <header class="resume-topbar">
        <img id="resumePhoto" class="resume-photo" src="assets/avatar.png" alt="王子涵照片">
        <div class="resume-identity">
          <h1 id="resumeName">王子涵</h1>
          <p id="resumeTitle"></p>
        </div>
        <div class="resume-contact-grid" id="resumeContact"></div>
      </header>

      <section class="resume-section">
        <div class="resume-strip-title">
          <h2>教育背景</h2>
        </div>
        <div class="resume-stack" id="resumeEducation"></div>
      </section>

      <section class="resume-section">
        <div class="resume-strip-title">
          <h2>专业技能</h2>
        </div>
        <ul class="resume-bullet-list resume-skill-list" id="resumeSkills"></ul>
      </section>

      <section class="resume-section">
        <div class="resume-strip-title">
          <h2>项目经历</h2>
        </div>
        <div class="resume-stack" id="resumeProjects"></div>
      </section>

      <section class="resume-section">
        <div class="resume-strip-title">
          <h2>校园经历</h2>
        </div>
        <div class="resume-stack" id="resumeCampus"></div>
      </section>

      <section class="resume-section">
        <div class="resume-strip-title">
          <h2>竞赛与荣誉</h2>
        </div>
        <div class="resume-award-list" id="resumeAwards"></div>
      </section>
    </div>
  </main>

  <script src="scripts/main.js" defer></script>
</body>
</html>
